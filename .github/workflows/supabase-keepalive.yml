name: Supabase Keep Alive

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

permissions: {}

concurrency:
  group: supabase-keepalive
  cancel-in-progress: false

jobs:
  keepalive:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      SUPABASE_FUNCTION_URLS: ${{ secrets.SUPABASE_FUNCTION_URLS }}

    steps:
      - name: Install PostgreSQL client
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y postgresql-client

      # ── 1. Direct Postgres ping ──────────────────────────────────────────
      - name: Ping database (SELECT 1)
        if: ${{ env.SUPABASE_DB_URL != '' }}
        shell: bash
        run: |
          set -euo pipefail
          psql -v ON_ERROR_STOP=1 -qAt "$SUPABASE_DB_URL" -c 'SELECT 1;'
          echo "✅ DB ping OK"

      # ── 2. REST API — GET /rest/v1/ (counts as real API request) ─────────
      - name: Ping Supabase REST API
        if: ${{ env.SUPABASE_URL != '' && env.SUPABASE_ANON_KEY != '' }}
        shell: bash
        run: |
          set -euo pipefail
          TOKEN="${SUPABASE_SERVICE_ROLE_KEY:-${SUPABASE_ANON_KEY}}"

          echo "📡 Pinging REST API root..."
          STATUS=$(curl -sS -m 20 \
            -H "apikey: ${SUPABASE_ANON_KEY}" \
            -H "Authorization: Bearer ${TOKEN}" \
            -o /dev/null -w '%{http_code}' \
            "${SUPABASE_URL}/rest/v1/")
          echo "REST API status: $STATUS"
          [[ "$STATUS" -ge 200 && "$STATUS" -lt 500 ]] || { echo "❌ REST ping failed"; exit 1; }

      # ── 3. Auth API ping ─────────────────────────────────────────────────
      - name: Ping Supabase Auth API
        if: ${{ env.SUPABASE_URL != '' && env.SUPABASE_ANON_KEY != '' }}
        shell: bash
        run: |
          set -euo pipefail
          echo "🔐 Pinging Auth API..."
          STATUS=$(curl -sS -m 20 \
            -H "apikey: ${SUPABASE_ANON_KEY}" \
            -o /dev/null -w '%{http_code}' \
            "${SUPABASE_URL}/auth/v1/health")
          echo "Auth API status: $STATUS"
          [[ "$STATUS" -ge 200 && "$STATUS" -lt 500 ]] || echo "⚠️ Auth ping returned $STATUS (non-fatal)"

      # ── 4. Storage API ping ──────────────────────────────────────────────
      - name: Ping Supabase Storage API
        if: ${{ env.SUPABASE_URL != '' && env.SUPABASE_ANON_KEY != '' }}
        shell: bash
        run: |
          set -euo pipefail
          echo "🗄️ Pinging Storage API..."
          STATUS=$(curl -sS -m 20 \
            -H "apikey: ${SUPABASE_ANON_KEY}" \
            -H "Authorization: Bearer ${SUPABASE_ANON_KEY}" \
            -o /dev/null -w '%{http_code}' \
            "${SUPABASE_URL}/storage/v1/bucket")
          echo "Storage API status: $STATUS"
          [[ "$STATUS" -ge 200 && "$STATUS" -lt 500 ]] || echo "⚠️ Storage ping returned $STATUS (non-fatal)"

      # ── 5. Edge Functions (optional) ─────────────────────────────────────
      - name: Trigger Edge Function(s)
        if: ${{ env.SUPABASE_FUNCTION_URLS != '' }}
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t URLS < <(printf '%s\n' "$SUPABASE_FUNCTION_URLS" | tr ',' '\n')
          TOKEN="${SUPABASE_SERVICE_ROLE_KEY:-${SUPABASE_ANON_KEY:-}}"
          for url in "${URLS[@]}"; do
            url="$(echo "$url" | xargs)"
            [ -z "$url" ] && continue
            echo "⚡ Pinging function: ${url}"
            if [ -n "$TOKEN" ]; then
              STATUS=$(curl -sS -m 20 \
                -H "Authorization: Bearer $TOKEN" \
                -o /dev/null -w '%{http_code}' "$url")
            else
              STATUS=$(curl -sS -m 20 -o /dev/null -w '%{http_code}' "$url")
            fi
            if [[ "$STATUS" -ge 200 && "$STATUS" -lt 400 ]]; then
              echo "✅ Function responded: $STATUS"
            else
              echo "❌ Function ping failed: $STATUS" >&2
              exit 1
            fi
          done

      # ── 6. Summary ───────────────────────────────────────────────────────
      - name: Keep-alive summary
        shell: bash
        run: |
          echo "🎉 Keep-alive complete at $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
