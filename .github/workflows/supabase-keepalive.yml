name: Supabase Keep Alive + Backup

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  actions: write

concurrency:
  group: supabase-keepalive
  cancel-in-progress: false

jobs:
  keepalive:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}

    steps:
      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y postgresql-client

      # ── 1. Direct Postgres ping ──────────────────────────────────────────
      - name: Ping database (SELECT 1)
        if: ${{ env.SUPABASE_DB_URL != '' }}
        shell: bash
        run: |
          set -euo pipefail
          psql -v ON_ERROR_STOP=1 -qAt "$SUPABASE_DB_URL" -c 'SELECT 1;'
          echo "✅ DB ping OK"

      # ── 2. REST API ping (no key needed, 401 still counts) ───────────────
      - name: Ping Supabase REST / Auth / Storage
        if: ${{ env.SUPABASE_URL != '' }}
        shell: bash
        run: |
          set -euo pipefail
          BASE="$SUPABASE_URL"
          ANON="${SUPABASE_ANON_KEY:-}"

          ping_url() {
            local label="$1" url="$2"
            local STATUS
            if [ -n "$ANON" ]; then
              STATUS=$(curl -sS -m 20 \
                -H "apikey: ${ANON}" \
                -H "Authorization: Bearer ${ANON}" \
                -o /dev/null -w '%{http_code}' "$url")
            else
              STATUS=$(curl -sS -m 20 -o /dev/null -w '%{http_code}' "$url")
            fi
            echo "${label}: ${STATUS}"
          }

          ping_url "📡 REST"    "${BASE}/rest/v1/"
          ping_url "🔐 Auth"    "${BASE}/auth/v1/health"
          ping_url "🗄️ Storage" "${BASE}/storage/v1/status"

      # ── 3. Backup all tables → JSON ──────────────────────────────────────
      - name: Discover all user tables
        if: ${{ env.SUPABASE_DB_URL != '' }}
        id: tables
        shell: bash
        run: |
          set -euo pipefail
          TABLES=$(psql -qAt "$SUPABASE_DB_URL" <<'SQL'
            SELECT tablename
            FROM pg_tables
            WHERE schemaname = 'public'
            ORDER BY tablename;
          SQL
          )
          echo "Found tables:"
          echo "$TABLES"
          # Pass as newline-separated list to next step via file
          echo "$TABLES" > /tmp/tables.txt

      - name: Export each table to JSON
        if: ${{ env.SUPABASE_DB_URL != '' }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p backup
          TIMESTAMP=$(date -u '+%Y%m%d_%H%M%S')

          while IFS= read -r table; do
            [ -z "$table" ] && continue
            echo "📦 Exporting: $table"

            # Export as JSON array via psql
            psql -qAt "$SUPABASE_DB_URL" \
              -c "SELECT json_agg(row_to_json(t)) FROM (SELECT * FROM public.\"${table}\") t;" \
              | sed 's/^null$/[]/' \
              > "backup/${table}.json"

            ROWS=$(jq 'length' "backup/${table}.json" 2>/dev/null || echo "?")
            echo "  → ${ROWS} rows"
          done < /tmp/tables.txt

          # Write manifest
          cat > backup/_manifest.json << EOF
          {
            "timestamp": "$(date -u '+%Y-%m-%dT%H:%M:%SZ')",
            "tables": $(jq -Rs '[split("\n")[] | select(length>0)]' /tmp/tables.txt),
            "files": $(ls backup/*.json | xargs -I{} basename {} | jq -Rs '[split("\n")[] | select(length>0)]')
          }
          EOF

          echo "✅ Backup complete — $(ls backup/*.json | wc -l) files"

      # ── 4. Upload backup as GitHub Artifact ──────────────────────────────
      - name: Upload backup artifact
        if: ${{ env.SUPABASE_DB_URL != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: supabase-backup-${{ github.run_number }}-${{ github.run_attempt }}
          path: backup/
          retention-days: 7
          if-no-files-found: error

      # ── 5. Summary ───────────────────────────────────────────────────────
      - name: Summary
        shell: bash
        run: |
          echo "🎉 Keep-alive + backup complete at $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
          if [ -d backup ]; then
            echo ""
            echo "📁 Backed up files:"
            ls -lh backup/
          fi
